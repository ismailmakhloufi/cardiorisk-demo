app = "cardiorisk-demo"
primary_region = "cdg"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

# Volume persistant 1Go gratuit — garde doctors/patients/messages jusqu'en novembre et après
# Ne pas supprimer ce volume, même après un redeploy les logins jury restent
[[mounts]]
  source = "data"
  destination = "/app/data"
